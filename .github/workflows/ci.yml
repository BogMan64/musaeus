name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        # scripts/ included: it was previously unlinted only by omission, not
        # by decision, and had accumulated 28 findings nobody was seeing.
        run: ruff check musaeus/ tests/ scripts/
      - name: Ruff format check
        # Deliberately NOT scripts/. It holds one-off operational scripts and
        # vendored ORPHEUS code (scripts/car_library/vendor/); reformatting
        # those would be pure churn and would complicate re-vendoring
        # upstream changes. Lint catches real problems there; formatting is
        # enforced only on code this project actually authors and maintains.
        run: ruff format --check musaeus/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Mypy
        run: mypy musaeus/ --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev,fuzzy]"
      - name: Run tests
        run: pytest --tb=short -q
