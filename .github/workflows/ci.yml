name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check musaeus/ tests/
      - name: Ruff format check
        run: ruff format --check musaeus/ tests/
      # The rules, .semgrepignore and a test asserting they scan the tree they
      # claim to have existed since 2026-09-08 -- and nothing invoked the
      # scanner. The guard proved the rules were well-formed; nothing proved
      # they had ever run. Fixed 2026-09-09.
      - name: Install semgrep
        run: pip install semgrep
      - name: Semgrep
        run: semgrep --config .semgrep/rules.yml musaeus/ scripts/ tests/ --error --quiet

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Mypy
        run: mypy musaeus/ --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # ffmpeg is a TEST DEPENDENCY here, not a convenience.
      #
      # Without it ~275 tests skip, and the ones that skip are the ones that
      # exercise conversion, verification and quarantine -- the only code in
      # this project that can destroy an irreplaceable file. Measured
      # 2026-09-09: canonicalize.py sat at 20% coverage while the repository
      # carried 2,500 passing tests, and `_verify_conversion` -- the function
      # that decides whether it is safe to delete a lossless original -- was
      # in the uncovered range on every run CI had ever done.
      #
      # A green suite that has never executed the file-deleting path is the
      # same failure this project catalogues everywhere else: a check that
      # finds nothing is not a check that found nothing wrong.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: pip install -e ".[dev,fuzzy]"
      - name: Run tests
        run: pytest --tb=short -q
      # A test run must leave the repository as it found it. Measured, not
      # inferred: tests/test_tests_do_not_write_tracked_files.py reads source
      # and cannot follow a path stored in a variable, so this is the check
      # that cannot be fooled by how a path is spelled. On 2026-09-23 every
      # pytest dirtied 11 tracked evidence files and blocked a checkout
      # mid-merge; nothing in CI noticed, because nothing looked.
      - name: Tests left the working tree as they found it
        run: |
          dirty="$(git status --porcelain)"
          if [ -n "$dirty" ]; then
            echo "pytest changed the repository:"
            echo "$dirty"
            exit 1
          fi
      # The count is the point. If this number climbs, coverage of the
      # dangerous paths is silently draining away again.
      - name: Report skipped tests
        if: always()
        run: |
          pytest -q --collect-only >/dev/null 2>&1 || true
          pytest -q 2>&1 | tail -1
