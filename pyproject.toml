[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "musaeus"
version = "0.1.0"
description = "Music library pipeline framework — clean-room reference implementation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Grey + Claude" }]

dependencies = [
    # rapidfuzz for fuzzy matching (optional but strongly recommended)
    # install with: pip install rapidfuzz
    # falls back to difflib if absent
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
    "ruff",
]
fuzzy = [
    "rapidfuzz>=3",
]

[project.scripts]
musaeus = "musaeus.cli:main"

[project.entry-points."musaeus.console"]
musaeus-console = "musaeus.console:main"

# ── Tool config ───────────────────────────────────────────────────────────────

[tool.setuptools.packages.find]
where = ["."]
include = ["musaeus*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (ruff format handles it)
    "B008",  # function calls in default arguments
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # allow assert in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
