[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "musaeus"
version = "0.1.0"
description = "Music library pipeline framework — clean-room reference implementation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Grey + Claude" }]

dependencies = [
    "mutagen>=1.47",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
    "ruff",
    "mypy>=1.5",
    "semgrep",
]
fuzzy = [
    "rapidfuzz>=3",
]
bpm = [
    "essentia",
]

[project.scripts]
musaeus = "musaeus.cli:main"

[project.entry-points."musaeus.console"]
musaeus-console = "musaeus.console:main"

# ── Tool config ───────────────────────────────────────────────────────────────

[tool.setuptools.packages.find]
where = ["."]
include = ["musaeus*"]

[tool.ruff]
target-version = "py310"
line-length = 100

# Vendored ORPHEUS code is kept byte-identical to upstream so it can be
# re-synced without conflicts. `ruff --fix scripts/` modernised three of
# these files on 2026-08-23 (typing.Optional -> |, import reordering) and
# the changes were reverted; excluded here so it cannot happen again.
exclude = ["scripts/car_library/vendor"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (ruff format handles it)
    "B008",  # function calls in default arguments
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # allow assert in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
# parallel=true so each subprocess invocation (the vendored/standalone
# scripts under scripts/, tested by spawning them as real subprocesses,
# not imported in-process) writes its own uniquely-named .coverage.*
# data file instead of clobbering a shared one. Combine with `coverage
# combine` before reporting. Opt-in per test via MUSAEUS_COVERAGE_SUBPROCESS
# (see tests/test_build_aac_library_lufs_bake.py / test_build_alac_library_lufs_bake.py)
# -- normal `pytest tests/` runs are unaffected.
parallel = true
source = ["musaeus", "scripts"]
data_file = ".coverage"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
check_untyped_defs = false
