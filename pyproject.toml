[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "musaeus"
version = "0.1.0"
description = "Music library pipeline framework — clean-room reference implementation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Grey + Claude" }]

dependencies = [
    "mutagen>=1.47",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
    "ruff",
    "mypy>=1.5",
    "semgrep",
]
fuzzy = [
    "rapidfuzz>=3",
]
bpm = [
    "essentia",
]

[project.scripts]
musaeus = "musaeus.cli:main"

[project.entry-points."musaeus.console"]
musaeus-console = "musaeus.console:main"

# ── Tool config ───────────────────────────────────────────────────────────────

[tool.setuptools.packages.find]
where = ["."]
include = ["musaeus*"]

[tool.ruff]
target-version = "py310"
line-length = 100

# Vendored ORPHEUS code, excluded from ruff.
#
# THE ORIGINAL REASON NO LONGER HOLDS, and this comment used to assert it as
# though it did: "kept byte-identical to upstream so it can be re-synced
# without conflicts". Measured 2026-09-08 -- upstream's build_aac_library.py
# is 461 lines, this copy is 980. The fork is deep and deliberate (M-01,
# M-02, M-03, M-06, M-07, M-08, M-12 all landed here), so byte-identity is
# not recoverable and a clean re-sync is not available either way.
#
# What the exclusion costs, measured the same day: 16 ruff errors nobody has
# seen -- 6 non-pep585-annotation, 5 non-pep604-annotation-optional, 3
# unsorted-imports, 2 deprecated-import. All cosmetic; 14 auto-fixable.
# These are the same modernisations `ruff --fix` made on 2026-08-23 and that
# were reverted to protect the byte-identity now gone.
#
# M-15 in the Repair Register puts the choice plainly: restore byte-identity
# and keep the exclusion, or accept the fork and drop it. Holding both is the
# worst of each -- no re-sync AND no lint. The fork is already accepted in
# fact; formalising it by deleting this line is a one-line change awaiting
# Grey's ruling, recorded in MUSAEUS_TODO.md rather than made unilaterally,
# because reformatting 980 lines of vendored code is a policy decision.
exclude = ["scripts/car_library/vendor"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (ruff format handles it)
    "B008",  # function calls in default arguments
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # allow assert in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
# parallel=true so each subprocess invocation (the vendored/standalone
# scripts under scripts/, tested by spawning them as real subprocesses,
# not imported in-process) writes its own uniquely-named .coverage.*
# data file instead of clobbering a shared one. Combine with `coverage
# combine` before reporting. Opt-in per test via MUSAEUS_COVERAGE_SUBPROCESS
# (see tests/test_build_aac_library_lufs_bake.py / test_build_alac_library_lufs_bake.py)
# -- normal `pytest tests/` runs are unaffected.
parallel = true
source = ["musaeus", "scripts"]
data_file = ".coverage"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
check_untyped_defs = false
