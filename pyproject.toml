[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "musaeus"
version = "0.1.0"
description = "Music library pipeline framework — clean-room reference implementation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Grey + Claude" }]

dependencies = [
    "mutagen>=1.47",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
    "ruff",
    "mypy>=1.5",
    "semgrep",
]
fuzzy = [
    "rapidfuzz>=3",
]
bpm = [
    "essentia",
]

[project.scripts]
musaeus = "musaeus.cli:main"

[project.entry-points."musaeus.console"]
musaeus-console = "musaeus.console:main"

# ── Tool config ───────────────────────────────────────────────────────────────

[tool.setuptools.packages.find]
where = ["."]
include = ["musaeus*"]

[tool.ruff]
target-version = "py310"
line-length = 100

# Vendored ORPHEUS code is NOT excluded from ruff, deliberately.
#
# It was, on the stated grounds that the tree is "kept byte-identical to
# upstream so it can be re-synced without conflicts". Measured 2026-09-08:
# upstream's build_aac_library.py is 461 lines and this copy is 980, and
# seven repairs landed in it that day alone (M-01, M-02, M-03, M-06, M-07,
# M-08, M-12). Byte-identity was already gone, so the exclusion bought no
# re-sync while costing 16 unseen lint errors -- the worst of each.
#
# The fork is accepted. That is the whole content of this decision: this is
# MUSAEUS's copy now, it is maintained here, and it is linted like the rest
# of the tree. Re-syncing from ORPHEUS was never going to be a clean pull
# again; pretending otherwise hid real defects for weeks. (M-15.)

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (ruff format handles it)
    "B008",  # function calls in default arguments
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # allow assert in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
# parallel=true so each subprocess invocation (the vendored/standalone
# scripts under scripts/, tested by spawning them as real subprocesses,
# not imported in-process) writes its own uniquely-named .coverage.*
# data file instead of clobbering a shared one. Combine with `coverage
# combine` before reporting. Opt-in per test via MUSAEUS_COVERAGE_SUBPROCESS
# (see tests/test_build_aac_library_lufs_bake.py / test_build_alac_library_lufs_bake.py)
# -- normal `pytest tests/` runs are unaffected.
parallel = true
source = ["musaeus", "scripts"]
data_file = ".coverage"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
check_untyped_defs = false
